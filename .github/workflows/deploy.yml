
name: ShopSphere CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service
          - inventory-service
          - notification-service

    steps:
      # Step 1: Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Step 3: Check Java and Maven versions
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # Step 4: Build and run tests
      - name: Build and test application
        run: |
          mvn -B -ntp -f ${{ matrix.service }}/pom.xml clean verify

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t shopsphere/${{ matrix.service }}:${{ github.sha }} \
            -f ${{ matrix.service }}/Dockerfile \
            ${{ matrix.service }}
